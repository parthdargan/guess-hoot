<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Hoo?</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/163.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#090d18;--surface:#111827;--surface2:#1a2336;
      --border:#253047;--text:#eef0f6;--muted:#7a8aa8;
      --accent:#f5c518;--accent2:#c0392b;
      --ok:#2ecc71;--bad:#e74c3c;--radius:10px;
    }
    html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100%;background-image:radial-gradient(ellipse at 50% 0%,rgba(37,48,71,.6) 0%,transparent 70%);}
    #app{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 3rem;}
    .narrow{max-width:560px;margin:0 auto;}

    .btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 18px;font-size:13px;font-family:'DM Sans',sans-serif;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;transition:all .15s;}
    .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
    .btn.hi{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}
    .btn.hi:hover{background:#e0b000;}
    .btn.danger{border-color:var(--bad);color:var(--bad);}
    .btn.danger:hover{background:rgba(231,76,60,.1);}
    .btn:disabled{opacity:.4;cursor:default;}

    .big-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.8rem,11vw,4.5rem);letter-spacing:.04em;line-height:.9;color:var(--accent);text-shadow:3px 3px 0 var(--accent2);}
    .screen-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.04em;color:var(--accent);}

    /* Pokemon grid */
    .mon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px;margin:10px 0;}
    .mon-grid-30{grid-template-columns:repeat(10,1fr) !important;}
    @media(max-width:480px){.mon-grid-30{grid-template-columns:repeat(5,1fr) !important;}}
    .mon{position:relative;aspect-ratio:1;border-radius:5px;border:2px solid transparent;cursor:pointer;background:var(--surface);transition:border-color .12s,opacity .15s;overflow:hidden;}
    .mon img{width:100%;height:100%;object-fit:contain;display:block;}
    .mon:hover{border-color:rgba(245,197,24,.5);}
    .mon.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:rgba(245,197,24,.08);}
    .mon.out{opacity:.1;filter:grayscale(1);}
    .mon.out:hover{border-color:rgba(231,76,60,.4);}

    /* Turn card */
    .turn-card{padding:12px 16px;border-radius:var(--radius);margin-bottom:10px;text-align:center;}
    .turn-card.mine{background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.3);}
    .turn-card.theirs{background:var(--surface);border:1px solid var(--border);}
    .turn-card .label{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.04em;}
    .turn-card.mine .label{color:var(--accent);}
    .turn-card.theirs .label{color:var(--muted);}
    .turn-card .hint{font-size:12px;color:var(--muted);margin-top:3px;}

    /* My pokemon strip */
    .my-strip{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);margin-bottom:10px;}
    .my-strip img{object-fit:contain;flex-shrink:0;}
    .my-strip-label{text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
    .my-strip-name{font-family:'Bebas Neue',sans-serif;text-transform:capitalize;line-height:1.1;}
    .my-strip-count{margin-left:auto;text-align:right;color:var(--muted);}

    /* Share boxes */
    .share-box{padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;color:var(--muted);word-break:break-all;line-height:1.5;margin:6px 0 8px;}
    .field-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
    input[type=text]{width:100%;height:40px;padding:0 12px;font-size:14px;font-family:'DM Sans',sans-serif;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);}
    input[type=text]:focus{outline:none;border-color:var(--accent);}

    .gap{margin-top:16px;}
    .gap-sm{margin-top:8px;}
    .row{display:flex;gap:8px;align-items:center;}
    .col{display:flex;flex-direction:column;gap:8px;}
    .small{font-size:12px;}
    .muted{color:var(--muted);}

    /* Toast */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:999;pointer-events:none;transition:opacity .3s;}
    .toast.ok{background:var(--ok);color:#000;}
    .toast.bad{background:var(--bad);color:#fff;}

    /* Hover tooltip */
    .mon-tip{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:11px;white-space:nowrap;z-index:50;pointer-events:none;opacity:0;transition:opacity .15s;text-align:center;line-height:1.5;}
    .mon:hover .mon-tip{opacity:1;}
    .type-pill{font-size:9px;padding:1px 6px;border-radius:8px;color:#fff;display:inline-block;}

    /* Guess modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;flex-direction:column;padding:0;overflow:hidden;}
    .modal-box{background:var(--surface);border-top:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;margin-top:auto;max-height:92vh;border-radius:var(--radius) var(--radius) 0 0;}
    .modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--accent);}
    .modal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px;overflow-y:auto;flex:1;min-height:0;}
    .modal-confirm{display:flex;gap:8px;flex-shrink:0;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .fade{animation:fadeUp .3s ease both;}
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD1SKH7mMvRTZ1TBH5yEstjy3WdGmo6Rrw",
  authDomain: "pokemon-guess-who-4b6d7.firebaseapp.com",
  databaseURL: "https://pokemon-guess-who-4b6d7-default-rtdb.firebaseio.com",
  projectId: "pokemon-guess-who-4b6d7",
  storageBucket: "pokemon-guess-who-4b6d7.firebasestorage.app",
  messagingSenderId: "339271698314",
  appId: "1:339271698314:web:77216f28c16b286a76ea73"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

(function(){
'use strict';

// ── State ──────────────────────────────────────────────
let allMon = [];   // [{id, name}] — all 1025
let pickedId = null;

// ── Pool constants ─────────────────────────────────────
const GEN_RANGES = [[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];
const GEN_NAMES  = ['Kanto','Johto','Hoenn','Sinnoh','Unova','Kalos','Alola','Galar','Paldea'];
const POPULAR_IDS = [1,3,4,6,7,9,25,39,52,54,59,65,79,94,130,133,143,149,150,151,196,197,257,282,376,384,445,448,658,700];
const TC = {normal:'#A8A77A',fire:'#EE8130',water:'#6390F0',electric:'#F7D02C',grass:'#7AC74C',ice:'#96D9D6',fighting:'#C22E28',poison:'#A33EA1',ground:'#E2BF65',flying:'#A98FF3',psychic:'#F95587',bug:'#A6B91A',rock:'#B6A136',ghost:'#735797',dragon:'#6F35FC',dark:'#705746',steel:'#B7B7CE',fairy:'#D685AD'};
const getGen = id => { for(let i=0;i<GEN_RANGES.length;i++){const[s,e]=GEN_RANGES[i];if(id>=s&&id<=e)return i+1;} return '?'; };

// ── Type cache ─────────────────────────────────────────
const monTypes = new Map(); // id -> ['fire', 'flying', ...]
async function loadPoolTypes(poolMon) {
  const missing = poolMon.filter(m => !monTypes.has(m.id));
  if (!missing.length) return;
  await Promise.all(missing.map(async m => {
    try {
      const r = await fetch(`https://pokeapi.co/api/v2/pokemon/${m.id}`);
      const d = await r.json();
      monTypes.set(m.id, d.types.map(t => t.type.name));
    } catch { monTypes.set(m.id, []); }
  }));
}

function getPoolMon(game) {
  if (!game?.pool) return allMon.slice(0, 151);
  if (game.pool === 'popular') return allMon.filter(m => POPULAR_IDS.includes(m.id));
  if (game.pool === 'random' && game.poolIds) return allMon.filter(m => game.poolIds.includes(m.id));
  if (game.pool.startsWith('gen')) {
    const [s, e] = GEN_RANGES[parseInt(game.pool.slice(3)) - 1];
    return allMon.filter(m => m.id >= s && m.id <= e);
  }
  return allMon.slice(0, 151);
}

// Stored URLs to avoid encoding them in onclick attributes
const urls = {};

// ── Helpers ────────────────────────────────────────────
const b64e = n => btoa(String(n));
const b64d = s => { try { return parseInt(atob(s), 10); } catch { return null; } };
const spriteUrl = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const randCode = () => Math.random().toString(36).slice(2, 8).toUpperCase();
const el = id => document.getElementById(id);
const app = () => el('app');
const getP = () => new URLSearchParams(location.search);

function buildUrl(params) {
  const p = new URLSearchParams();
  Object.entries(params).forEach(([k, v]) => v != null && p.set(k, v));
  return `${location.origin}${location.pathname}?${p}`;
}
function setUrl(params) {
  history.replaceState(null, '', location.pathname + '?' + new URLSearchParams(params));
}

function toast(msg, type = 'ok', ms = 2000) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms);
}

function copyText(text, btnId, label = 'Copied!') {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  };
  (navigator.clipboard ? navigator.clipboard.writeText(text).catch(fallback) : Promise.resolve(fallback()))
    .then(() => {
      const btn = el(btnId);
      if (btn) { const orig = btn.textContent; btn.textContent = label; setTimeout(() => btn.textContent = orig, 2000); }
    });
}

// ── Firebase listener cleanup ──────────────────────────
let unsubscribers = [];
function clearListeners() { unsubscribers.forEach(u => u()); unsubscribers = []; }
function listen(dbRef, cb) { unsubscribers.push(onValue(dbRef, cb)); }

// ── Boot ───────────────────────────────────────────────
async function boot() {
  app().innerHTML = `<div style="padding:3rem;text-align:center;color:var(--muted)">Loading Pokédex…</div>`;
  try {
    const r = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');
    const d = await r.json();
    allMon = d.results.map((p, i) => ({ id: i + 1, name: p.name }));
    await route();
  } catch(e) {
    app().innerHTML = `<div style="padding:2rem;color:var(--bad)">Failed to load — check your connection.</div>`;
  }
}

async function route() {
  const code = getP().get('code');
  const me = parseInt(getP().get('me') || '0', 10);
  if (!code) { showHome(); return; }

  app().innerHTML = `<div style="padding:3rem;text-align:center;color:var(--muted)">Loading game…</div>`;
  const snap = await get(ref(db, `games/${code}`));
  const game = snap.val();

  const poolMon = getPoolMon(game);

  const poolKey = game?.pool || 'gen1';

  if (me === 1) {
    if (!game?.pool) { showPoolSelect(code); return; }
    if (!game?.p1)   { showPickP1(code, poolMon); return; }
    if (!game?.p2)   { showWaitP1(code, game.p1, poolMon, poolKey); return; }
    showGame(code, 1, game.p1, game.p2, poolMon, poolKey);
  } else if (me === 2) {
    if (!game?.p1 || !game?.p2) { showHome(); return; }
    showGame(code, 2, game.p1, game.p2, poolMon, poolKey);
  } else {
    // P2 joining via shared link
    if (!game?.p1) { toast('Game not found — ask Player 1 for a new link', 'bad', 3000); showHome(); return; }
    if (game?.p2)  { setUrl({ code, me: 2 }); showGame(code, 2, game.p1, game.p2, poolMon, poolKey); return; }
    showPickP2(code, poolMon);
  }
}

// ── Screens ────────────────────────────────────────────

function showHome() {
  clearListeners();
  app().innerHTML = `<div class="fade narrow" style="text-align:center;padding-top:2rem">

    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/163.png"
         style="width:96px;height:96px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 12px rgba(245,197,24,.25))"
         alt="Hoothoot" />

    <div class="big-title" style="margin-top:4px">Guess Hoo?</div>
    <div style="color:var(--muted);font-size:14px;margin-top:8px;margin-bottom:32px;letter-spacing:.02em">
      The Pokémon guessing game for two
    </div>

    <div style="display:flex;gap:24px;justify-content:center;margin-bottom:36px;flex-wrap:wrap">
      <div style="flex:1;min-width:120px;max-width:160px">
        <div style="font-size:2rem;margin-bottom:8px">🎲</div>
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px">Step 1</div>
        <div style="font-size:13px;font-weight:500;margin-bottom:4px">Pick your pool</div>
        <div style="font-size:11px;color:var(--muted);line-height:1.6">Choose a generation or a curated set of 30</div>
      </div>
      <div style="width:1px;background:var(--border);align-self:stretch;flex-shrink:0"></div>
      <div style="flex:1;min-width:120px;max-width:160px">
        <div style="font-size:2rem;margin-bottom:8px">🔗</div>
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px">Step 2</div>
        <div style="font-size:13px;font-weight:500;margin-bottom:4px">Share a link</div>
        <div style="font-size:11px;color:var(--muted);line-height:1.6">Send one link to your opponent — no account needed</div>
      </div>
      <div style="width:1px;background:var(--border);align-self:stretch;flex-shrink:0"></div>
      <div style="flex:1;min-width:120px;max-width:160px">
        <div style="font-size:2rem;margin-bottom:8px">🦉</div>
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px">Step 3</div>
        <div style="font-size:13px;font-weight:500;margin-bottom:4px">Guess hoo it is</div>
        <div style="font-size:11px;color:var(--muted);line-height:1.6">Ask yes/no questions, eliminate, and make your guess</div>
      </div>
    </div>

    <div class="col" style="max-width:360px;margin:0 auto">
      <button class="btn hi" style="font-size:15px;padding:13px" onclick="_gw.newGame()">🎮 New Game</button>
      <div style="text-align:center;color:var(--muted);font-size:12px;margin:2px 0">— or join an existing game —</div>
      <div class="row">
        <input type="text" id="join-input" placeholder="Paste invite link or code" />
        <button class="btn" onclick="_gw.join()">Join →</button>
      </div>
    </div>

    <div style="margin-top:28px">
      <a href="index.html" style="font-size:12px;color:var(--muted);text-decoration:none;opacity:.6">← Pokémon Quiz</a>
    </div>
  </div>`;
}

function showPoolSelect(code) {
  app().innerHTML = `<div class="fade">
    <div class="row" style="margin-bottom:12px">
      <button class="btn" onclick="_gw.home()" style="font-size:12px;padding:5px 12px">← Back</button>
      <span class="screen-title">Choose a pool</span>
    </div>
    <p class="muted small" style="margin-bottom:16px">Player 1 picks the pool — both players will see the same Pokémon.</p>

    <div class="field-label" style="margin-bottom:8px">Quick picks</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px">
      <button class="btn hi" style="flex-direction:column;height:60px;gap:2px" onclick="_gw.selectPool('${code}','popular')">
        <span>⭐ Popular 30</span>
        <span style="font-size:10px;font-weight:400;opacity:.75">Fan favorites, all gens</span>
      </button>
      <button class="btn" style="flex-direction:column;height:60px;gap:2px" onclick="_gw.selectPool('${code}','random')">
        <span>🎲 Random 30</span>
        <span style="font-size:10px;color:var(--muted)">Surprise from all gens</span>
      </button>
    </div>

    <div class="field-label" style="margin-bottom:8px">By generation</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
      ${GEN_RANGES.map(([s,e],i) => `
        <button class="btn" style="flex-direction:column;padding:10px 6px;gap:2px" onclick="_gw.selectPool('${code}','gen${i+1}')">
          <span style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.04em;color:var(--accent)">Gen ${i+1}</span>
          <span style="font-size:10px;color:var(--muted)">${GEN_NAMES[i]}</span>
          <span style="font-size:10px;color:var(--muted)">${e-s+1} Pokémon</span>
        </button>`).join('')}
    </div>
  </div>`;
}

function showPickP1(code, poolMon) {
  pickedId = null;
  app().innerHTML = `<div class="fade">
    <div class="narrow">
      <div class="row" style="margin-bottom:12px">
        <button class="btn" onclick="_gw.home()" style="font-size:12px;padding:5px 12px">← Back</button>
        <span class="screen-title">Pick your Pokémon</span>
      </div>
      <p class="muted small" style="margin-bottom:8px">Choose carefully — and don't show your opponent! 🫣</p>
    </div>
    ${monGridHTML(true, new Set(), poolMon)}
    <div class="narrow" id="pick-confirm" style="display:none;margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
      <div style="margin-bottom:10px">You picked: <strong id="pick-name" style="color:var(--accent);text-transform:capitalize"></strong></div>
      <button class="btn hi" onclick="_gw.confirmP1('${code}')">Confirm & get link →</button>
    </div>
  </div>`;
}

function showPickP2(code, poolMon) {
  pickedId = null;
  app().innerHTML = `<div class="fade">
    <div class="narrow" style="margin-bottom:12px">
      <div class="screen-title">You've been challenged!</div>
      <p class="muted small" style="margin-top:4px">Pick your secret Pokémon to accept 🫣</p>
    </div>
    ${monGridHTML(true, new Set(), poolMon)}
    <div class="narrow" id="pick-confirm" style="display:none;margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
      <div style="margin-bottom:10px">You picked: <strong id="pick-name" style="color:var(--accent);text-transform:capitalize"></strong></div>
      <button class="btn hi" onclick="_gw.confirmP2('${code}')">Ready — start game →</button>
    </div>
  </div>`;
}

function showWaitP1(code, p1Id, poolMon, poolKey) {
  clearListeners();
  const shareUrl = buildUrl({ code });
  urls.p1share = shareUrl;
  app().innerHTML = `<div class="fade">
    <div class="screen-title" style="margin-bottom:6px">Waiting for Player 2…</div>
    <p class="muted small" style="margin-bottom:12px">Send them this link. The game will start automatically once they pick their Pokémon.</p>
    <div class="share-box">${shareUrl}</div>
    <button class="btn hi" id="btn-copy-share" onclick="_gw.copy('p1share','btn-copy-share')" style="margin-bottom:20px">Copy link</button>
    <div style="text-align:center;color:var(--muted);font-size:12px">⏳ Waiting for Player 2 to join…</div>
  </div>`;

  listen(ref(db, `games/${code}/p2`), snap => {
    const p2Id = snap.val();
    if (p2Id) {
      clearListeners();
      setUrl({ code, me: 1 });
      showGame(code, 1, p1Id, p2Id, poolMon, poolKey);
    }
  });
}

// ── Game board ─────────────────────────────────────────

async function showGame(code, me, p1Id, p2Id, poolMon, poolKey) {
  clearListeners();
  app().innerHTML = `<div style="padding:2rem;text-align:center;color:var(--muted)">Preparing game…</div>`;
  await loadPoolTypes(poolMon);

  const isGenPool = poolKey && poolKey.startsWith('gen');
  const myId  = me === 1 ? p1Id : p2Id;
  const oppId = me === 1 ? p2Id : p1Id;
  const myMon = allMon.find(m => m.id === myId);
  const oppMon = allMon.find(m => m.id === oppId);

  const elimKey = `gw-elim-${code}-${me}`;
  let elim = new Set(JSON.parse(localStorage.getItem(elimKey) || '[]'));
  let currentTurn = 1;
  let gameOver = false;

  function saveElim() { localStorage.setItem(elimKey, JSON.stringify([...elim])); }

  function typePillsHTML(id) {
    return (monTypes.get(id) || []).map(t =>
      `<span class="type-pill" style="background:${TC[t]||'#555'}">${t}</span>`
    ).join(' ');
  }

  function drawBoard() {
    const myTurn = currentTurn === me;
    const remaining = poolMon.length - elim.size;
    // Scale strip proportionally to the grid icon size
    const cellSize = poolMon.length === 30
      ? Math.floor(((document.getElementById('app')?.offsetWidth || window.innerWidth) - 32) / 10)
      : gridIconSize(poolMon.length);
    const imgSize  = Math.max(44, Math.min(96, Math.round(cellSize * 0.72)));
    const nameSize = Math.max(1.1, Math.min(2.2, imgSize / 38)) + 'rem';
    const metaSize = Math.max(10, Math.min(15, Math.round(imgSize * 0.18))) + 'px';
    app().innerHTML = `<div>
        <div class="my-strip">
          <img src="${spriteUrl(myId)}" alt="${myMon.name}" style="width:${imgSize}px;height:${imgSize}px" />
          <div>
            <div class="my-strip-label" style="font-size:${metaSize}">Your Pokémon</div>
            <div class="my-strip-name" style="font-size:${nameSize}">${myMon.name}</div>
            <div style="display:flex;gap:4px;align-items:center;margin-top:3px;flex-wrap:wrap">
              ${!isGenPool ? `<span style="font-size:${metaSize};color:var(--muted)">Gen ${getGen(myId)}</span>` : ''}
              ${typePillsHTML(myId)}
            </div>
          </div>
          <div class="my-strip-count" style="font-size:${metaSize}">${remaining} left</div>
        </div>
        <div class="turn-card ${myTurn ? 'mine' : 'theirs'}">
          <div class="label">${myTurn ? '🎯 Your turn — ask a question!' : '⏳ Opponent\'s turn'}</div>
          <div class="hint">${myTurn
            ? 'Ask verbally, wait for the answer, then eliminate below'
            : 'Answer their question — their screen will advance when done'
          }</div>
        </div>
        <div class="row" style="margin-bottom:12px">
          <button class="btn" style="flex:1" onclick="_gw.passTurn()" ${myTurn ? '' : 'disabled'}>
            ${myTurn ? 'Done asking →' : 'Waiting for opponent…'}
          </button>
          <button class="btn danger" onclick="_gw.guess()">Guess 🎯</button>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Tap to eliminate · tap again to restore</div>
      ${monGridHTML(false, elim, poolMon, poolKey)}
    </div>`;
  }

  function showResult(won) {
    gameOver = true;
    clearListeners();
    localStorage.removeItem(elimKey);
    app().innerHTML = `<div class="fade" style="text-align:center;padding:3rem 0">
      <div style="font-size:3.5rem;margin-bottom:8px">${won ? '🏆' : '😔'}</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:4rem;color:${won ? 'var(--accent)' : 'var(--bad)'};text-shadow:3px 3px 0 ${won ? 'var(--accent2)' : '#900'};line-height:1">${won ? 'You win!' : 'You lost!'}</div>
      <p class="muted small" style="margin-top:8px">It was <strong style="color:var(--accent);text-transform:capitalize">${oppMon.name}</strong>!</p>
      <img src="${spriteUrl(oppId)}" style="width:130px;display:block;margin:16px auto" />
      <div class="row" style="justify-content:center;margin-top:16px;flex-wrap:wrap">
        <button class="btn hi" onclick="location.href=location.pathname">New Game</button>
        <button class="btn" onclick="location.href='index.html'">← Quiz Home</button>
      </div>
    </div>`;
  }

  // Real-time listeners
  listen(ref(db, `games/${code}/turn`), snap => {
    const t = snap.val();
    if (t !== null && !gameOver) { currentTurn = t; drawBoard(); }
  });

  listen(ref(db, `games/${code}/winner`), snap => {
    const w = snap.val();
    if (w && w !== 0 && !gameOver) showResult(w === me);
  });

  // Actions
  window._gw.elim = function(id) {
    if (elim.has(id)) elim.delete(id); else elim.add(id);
    saveElim(); drawBoard();
  };

  window._gw.passTurn = function() {
    update(ref(db, `games/${code}`), { turn: me === 1 ? 2 : 1 });
  };

  window._gw.guess = function() {
    let guessId = null;

    const candidates = poolMon.filter(m => !elim.has(m.id));
    const n = candidates.length;
    const modalCols = n <= 8 ? 4 : n <= 15 ? 5 : n <= 24 ? 6 : n <= 30 ? 10 : Math.ceil(Math.sqrt(n) * 1.5);
    const iconSize  = n <= 8 ? 110 : n <= 16 ? 90 : n <= 28 ? 76 : 62;
    const cells = candidates.map(m => `
      <div class="mon" id="gmon-${m.id}" onclick="_gw.guessPick(${m.id})">
        <img src="${spriteUrl(m.id)}" alt="${m.name}" loading="lazy" />
        <div class="mon-tip">
          <div style="text-transform:capitalize;font-weight:500;color:var(--text)">${m.name}</div>
          ${!isGenPool ? `<div style="color:var(--muted)">Gen ${getGen(m.id)}</div>` : ''}
          <div style="display:flex;gap:3px;justify-content:center;margin-top:2px">${typePillsHTML(m.id)}</div>
        </div>
      </div>`).join('');

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">Who is it? Tap to select</div>
        <div style="font-size:12px;color:var(--muted)">${candidates.length} remaining</div>
        <div class="modal-grid" style="grid-template-columns:repeat(${modalCols},1fr)">${cells}</div>
        <div class="modal-confirm">
          <button class="btn" style="flex:1" onclick="_gw.guessCancel()">Cancel</button>
          <button class="btn hi" id="guess-confirm-btn" style="flex:1" onclick="_gw.guessConfirm()" disabled>Confirm guess</button>
        </div>
      </div>`;
    document.body.appendChild(modal);

    window._gw.guessPick = function(id) {
      guessId = id;
      modal.querySelectorAll('.mon').forEach(m => m.classList.remove('picked'));
      modal.querySelector(`#gmon-${id}`)?.classList.add('picked');
      document.getElementById('guess-confirm-btn').disabled = false;
    };

    window._gw.guessCancel = function() { modal.remove(); };

    window._gw.guessConfirm = async function() {
      if (!guessId) return;
      modal.remove();
      if (guessId === oppMon.id) {
        update(ref(db, `games/${code}`), { winner: me });
      } else {
        const wrong = poolMon.find(m => m.id === guessId);
        toast(`Not ${wrong.name}! Turn passes to opponent.`, 'bad', 2500);
        update(ref(db, `games/${code}`), { turn: me === 1 ? 2 : 1 });
      }
    };
  };
}

// ── Grid builder ───────────────────────────────────────

function gridIconSize(poolSize) {
  const w = (document.getElementById('app')?.offsetWidth || window.innerWidth) - 32;
  const targetCols = Math.ceil(Math.sqrt(poolSize) * Math.min(2, Math.sqrt(w / 400)));
  return Math.max(62, Math.floor(w / targetCols));
}

function monGridHTML(pickMode, elim = new Set(), poolMon = allMon.slice(0,151), poolKey = '') {
  const isGenPool = poolKey && poolKey.startsWith('gen');
  const is30 = poolMon.length === 30;
  const iconSize = is30 ? null : gridIconSize(poolMon.length);
  const cells = poolMon.map(m => {
    if (pickMode) {
      return `<div class="mon" id="mon-${m.id}" onclick="_gw.pick(${m.id})" title="${m.name}">
        <img src="${spriteUrl(m.id)}" alt="${m.name}" loading="lazy" />
      </div>`;
    }
    const types = monTypes.get(m.id) || [];
    const pills = types.map(t => `<span class="type-pill" style="background:${TC[t]||'#555'}">${t}</span>`).join(' ');
    return `<div class="mon ${elim.has(m.id) ? 'out' : ''}" onclick="_gw.elim(${m.id})">
      <img src="${spriteUrl(m.id)}" alt="${m.name}" loading="lazy" />
      <div class="mon-tip">
        <div style="text-transform:capitalize;font-weight:500;color:var(--text)">${m.name}</div>
        ${!isGenPool ? `<div style="color:var(--muted)">Gen ${getGen(m.id)}</div>` : ''}
        ${pills ? `<div style="display:flex;gap:3px;justify-content:center;margin-top:2px">${pills}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  const gridStyle = is30 ? '' : ` style="grid-template-columns:repeat(auto-fill,minmax(${iconSize}px,1fr))"`;
  return `<div class="mon-grid${is30 ? ' mon-grid-30' : ''}"${gridStyle}>${cells}</div>`;
}

// ── Global actions ─────────────────────────────────────

window._gw = {
  home: showHome,
  newGame() {
    const code = randCode();
    setUrl({ code, me: 1 });
    showPoolSelect(code);
  },
  async selectPool(code, poolKey) {
    const data = { pool: poolKey, turn: 1, winner: 0 };
    if (poolKey === 'random') {
      const shuffled = [...allMon].sort(() => Math.random() - 0.5);
      data.poolIds = shuffled.slice(0, 30).map(m => m.id);
    }
    await set(ref(db, `games/${code}`), data);
    showPickP1(code, getPoolMon(data));
  },
  join() {
    const val = el('join-input')?.value.trim();
    if (!val) return;
    if (val.startsWith('http')) location.href = val;
    else toast('Paste the full link from Player 1', 'bad');
  },
  pick(id) {
    pickedId = id;
    document.querySelectorAll('.mon').forEach(m => m.classList.remove('picked'));
    el(`mon-${id}`)?.classList.add('picked');
    el('pick-confirm').style.display = 'block';
    el('pick-name').textContent = allMon.find(m => m.id === id)?.name || '';
    el('pick-confirm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  },
  async confirmP1(code) {
    if (!pickedId) return;
    await update(ref(db, `games/${code}`), { p1: pickedId });
    const snap = await get(ref(db, `games/${code}`));
    const g = snap.val(); showWaitP1(code, pickedId, getPoolMon(g), g.pool || 'gen1');
  },
  async confirmP2(code) {
    if (!pickedId) return;
    await update(ref(db, `games/${code}`), { p2: pickedId });
    setUrl({ code, me: 2 });
    const snap = await get(ref(db, `games/${code}`));
    const game = snap.val();
    showGame(code, 2, game.p1, game.p2, getPoolMon(game), game.pool || 'gen1');
  },
  copy(key, btnId) { copyText(urls[key], btnId); },
  // Stubs overwritten when game loads
  elim() {}, passTurn() {}, guess() {},
};

boot();
})();
</script>
</body>
</html>
